<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix: tell the user when the payment SDK is missing</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
    .method { display: block; padding: .5rem 0; }
    .card-fields input { display: block; width: 100%; margin: .25rem 0; padding: .4rem; box-sizing: border-box; }
    .note { background: #f4f4f4; padding: .75rem; font-size: 14px; }
    .alert { border: 1px solid #c00; background: #fff4f4; padding: .75rem; }
  </style>
</head>
<body>
  <h1>How would you like to pay?</h1>
  <p class="note">
    Same page as <code>repro/</code>, with a site-side fallback.
    Open <a href="?block=1">?block=1</a>: instead of silently losing four payment methods,
    the user gets a clear message and a way forward.
  </p>

  <div id="card-container"></div>
  <label class="method"><input type="radio" name="pm"> PayPal</label>
  <label class="method"><input type="radio" name="pm"> Apple Pay</label>

  <script>
    if (!new URLSearchParams(location.search).has('block')) {
      document.write('<script src="../repro/payment-sdk-standin.js"><\/script>');
    }
  </script>
  <script>
    const FALLBACK =
      '<p class="alert" role="alert">Card payments could not load. ' +
      'A content blocker may be stopping our payment provider. ' +
      'You can pay with PayPal or Apple Pay, or allow this site in your blocker and reload.</p>';

    async function initializeCheckout() {
      const container = document.getElementById('card-container');

      // 1. Check the SDK global before calling it.
      if (typeof window.AdyenCheckout !== 'function') {
        container.innerHTML = FALLBACK;
        console.warn('Payment SDK not available; showing fallback message.');
        return;
      }

      // 2. Catch any other failure inside the SDK.
      try {
        const checkout = await AdyenCheckout({ locale: 'en-US', environment: 'live' });
        checkout.create('card').mount('#card-container');
      } catch (err) {
        container.innerHTML = FALLBACK;
        console.error('Payment SDK failed to initialise:', err);
      }
    }
    initializeCheckout();
  </script>
</body>
</html>
